<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#e9efe6" />
  <title>жарка шашлыка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e9efe6;
      --ink: #1c1c1c;
      --muted: #6d726a;
      --faint: rgba(28, 28, 28, .14);
      --line: 1.5px solid var(--ink);
      --r: 22px;
      --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --mono: "Space Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
      -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
    }
    .app {
      max-width: 520px; margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
    }

    /* header */
    .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 6px 0 16px; }
    h1 { margin: 0; font-size: clamp(30px, 9vw, 42px); font-weight: 500; letter-spacing: -.03em; line-height: 1; text-transform: lowercase; }
    .badge {
      font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
      display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; padding-bottom: 6px;
    }
    .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: var(--line); }
    .badge.on::before { background: var(--ink); }
    .badge.paused::before { background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px); }

    .k { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .v { font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }

    /* hero pill */
    .hero {
      border: var(--line); border-radius: 44px; padding: 14px 14px 14px 20px;
      display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    }
    .hero .v { font-size: clamp(26px, 8vw, 32px); }
    .hero-text { font-family: var(--mono); font-size: 12px; line-height: 1.35; text-transform: lowercase; }
    .ring { position: relative; width: 64px; height: 64px; flex: none; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
    .ring circle { fill: none; stroke-width: 3; stroke-linecap: round; }
    .ring .bg { stroke: var(--faint); }
    .ring .fg { stroke: var(--ink); stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .2s linear; }
    .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }

    /* cards */
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .card { border: var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .card-head { display: flex; flex-direction: column; gap: 2px; }
    .card-head b { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .card-head span { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: lowercase; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .stepper { display: flex; align-items: center; gap: 6px; }
    .stepper button {
      user-select: none; -webkit-user-select: none;
      width: 30px; height: 30px; border-radius: 50%; border: var(--line); background: transparent; color: var(--ink);
      font: 500 18px/1 var(--sans); padding: 0; cursor: pointer; flex: none; display: grid; place-items: center;
    }
    .stepper button:active { background: var(--ink); color: var(--bg); }
    .stepper input {
      width: 100%; min-width: 0; text-align: center; background: transparent; border: 0; outline: none; color: var(--ink);
      font: 500 26px/1.1 var(--sans); letter-spacing: -.02em; padding: 0; -moz-appearance: textfield; appearance: textfield;
    }
    .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .skewers {
      height: 44px; margin-top: auto; border-radius: 8px;
      background: repeating-linear-gradient(90deg, var(--ink) 0 1.5px, transparent 1.5px 8px);
      -webkit-mask: linear-gradient(90deg, #000 70%, transparent);
      mask: linear-gradient(90deg, #000 70%, transparent);
    }
    .link {
      align-self: flex-start; background: transparent; border: 0; padding: 0; color: var(--ink); cursor: pointer;
      font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; text-decoration: underline; text-underline-offset: 3px;
    }

    /* buttons */
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .btn {
      user-select: none; -webkit-user-select: none;
      border: var(--line); background: transparent; color: var(--ink); border-radius: 999px;
      padding: 15px 14px; font: 500 16px/1 var(--sans); text-transform: lowercase; cursor: pointer; letter-spacing: -.01em;
    }
    .btn.primary { grid-column: 1 / -1; background: var(--ink); color: var(--bg); padding: 18px; font-size: 18px; }
    .btn:disabled { opacity: .3; cursor: not-allowed; }
    .btn:not(:disabled):active { transform: scale(.98); }

    /* rows */
    .rows { margin-top: 20px; border-top: var(--line); }
    .row {
      display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: var(--line);
      font-family: var(--mono); font-size: 13px; text-transform: uppercase; letter-spacing: .02em;
    }
    .row .name { flex: 1; min-width: 0; }
    .row .sub { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: lowercase; letter-spacing: 0; }
    .row .sub.path { overflow-wrap: anywhere; }
    .pill {
      user-select: none; -webkit-user-select: none; flex: none;
      border: var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 13px;
      font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
    }
    .pill:active { background: var(--ink); color: var(--bg); }

    /* modal sheet */
    .modal { position: fixed; inset: 0; z-index: 10; background: rgba(28, 28, 28, .45); display: flex; align-items: flex-end; justify-content: center; }
    .modal[hidden] { display: none; }
    .sheet {
      width: 100%; max-width: 520px; background: var(--bg); border: var(--line); border-bottom: 0;
      border-radius: 28px 28px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 10px; animation: up .2s ease-out;
    }
    @keyframes up { from { transform: translateY(24px); opacity: 0; } }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .sheet-head b { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .sheet-cur { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: lowercase; margin-bottom: 4px; }
    .sheet-cur > span { min-width: 0; overflow-wrap: anywhere; }
    .opt {
      position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 3px; text-align: left; width: 100%;
      border: var(--line); border-radius: 18px; padding: 14px 16px; background: transparent; color: var(--ink); cursor: pointer;
      font-family: var(--mono); text-transform: uppercase; letter-spacing: .02em;
    }
    .opt:active { background: var(--ink); color: var(--bg); }
    .opt .opt-t { font-size: 13px; }
    .opt .sub { font-size: 10px; color: var(--muted); text-transform: lowercase; letter-spacing: 0; }
    .opt:active .sub { color: inherit; }
    .opt input[type="file"] { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
    .urlbox { display: flex; gap: 8px; align-items: center; padding: 0 4px; }
    .urlbox[hidden] { display: none; }
    .urlbox input {
      flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed var(--muted); outline: none;
      color: var(--ink); font: 13px var(--mono); padding: 8px 0;
    }
    .urlbox .btn { padding: 10px 18px; font-size: 14px; }

    /* log */
    .log {
      margin-top: 14px; padding: 12px 14px; border: var(--line); border-radius: 16px; max-height: 220px; overflow: auto;
      font-family: var(--mono); font-size: 11px; line-height: 1.5;
    }
    .log div { margin-bottom: 4px; }
    .log div:first-child { font-weight: 700; }
    .sign { margin-top: 22px; font-family: var(--mono); font-size: 11px; line-height: 1.5; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>жарка шашлыка</h1>
      <div class="badge" id="badge">стоп</div>
    </header>

    <section class="hero">
      <div>
        <div class="k">время жарки</div>
        <div class="v" id="elapsed">00:00:00</div>
      </div>
      <div class="hero-text" id="status">нажми старт, чтобы начать жарить</div>
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 36 36">
          <circle class="bg" cx="18" cy="18" r="16" pathLength="100" />
          <circle class="fg" id="ringFg" cx="18" cy="18" r="16" pathLength="100" />
        </svg>
        <span id="ringText">—</span>
      </div>
    </section>

    <section class="cards">
      <div class="card">
        <div class="card-head"><b>интервал</b><span>секунды между сигналами</span></div>
        <div class="field">
          <div class="k">минимум</div>
          <div class="stepper">
            <button type="button" data-target="minSec" data-delta="-1" aria-label="минус">−</button>
            <input id="minSec" type="number" inputmode="numeric" min="1" value="15" />
            <button type="button" data-target="minSec" data-delta="1" aria-label="плюс">+</button>
          </div>
        </div>
        <div class="field">
          <div class="k">максимум</div>
          <div class="stepper">
            <button type="button" data-target="maxSec" data-delta="-1" aria-label="минус">−</button>
            <input id="maxSec" type="number" inputmode="numeric" min="1" value="20" />
            <button type="button" data-target="maxSec" data-delta="1" aria-label="плюс">+</button>
          </div>
        </div>
        <div class="skewers"></div>
      </div>

      <div class="card">
        <div class="card-head"><b>сигналы</b><span>переворачивай по звуку</span></div>
        <div class="field">
          <div class="k">переворотов</div>
          <div class="v" id="count">0</div>
        </div>
        <div class="field">
          <div class="k">следующий через</div>
          <div class="v" id="nextIn">—</div>
        </div>
        <button class="link" id="resetBtn" type="button">сброс счётчиков</button>
      </div>
    </section>

    <div class="btns">
      <button id="startBtn" class="btn primary" type="button">старт</button>
      <button id="pauseBtn" class="btn" type="button" disabled>пауза</button>
      <button id="stopBtn" class="btn" type="button" disabled>стоп</button>
    </div>

    <section class="rows">
      <div class="row">
        <div class="name">звук<span class="sub" id="soundName">загрузка…</span></div>
        <button class="pill" id="soundBtn" type="button">изменить</button>
      </div>
    </section>

    <div class="log" id="log" hidden></div>

    <div class="sign">je m’appelle dan et je travaille comme simple agent d’entretien. &#x2665;</div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <b id="sheetTitle">звук сигнала</b>
        <button class="pill" id="modalClose" type="button">закрыть</button>
      </div>
      <div class="sheet-cur">
        <span>сейчас: <span id="modalCur"></span></span>
        <button class="pill" id="testBtn" type="button">тест звука</button>
      </div>

      <label class="opt">
        <span class="opt-t">загрузить файл</span>
        <span class="sub">mp3 / wav / ogg с телефона</span>
        <input id="soundFile" type="file" accept="audio/*" />
      </label>

      <button class="opt" id="urlOpt" type="button">
        <span class="opt-t">вставить ссылку</span>
        <span class="sub">может не сыграть из-за cors</span>
      </button>
      <div class="urlbox" id="urlBox" hidden>
        <input id="soundUrl" type="text" placeholder="https://…" autocomplete="off" inputmode="url" />
        <button class="btn" id="urlApply" type="button">ок</button>
      </div>

      <button class="opt" id="defaultOpt" type="button">
        <span class="opt-t">звук по умолчанию</span>
        <span class="sub">sfx_s_challenge_update.mp3</span>
      </button>
    </div>
  </div>

<script>
(() => {
  const el = (id) => document.getElementById(id);

  const DEFAULT_SOUND = "sfx_s_challenge_update.mp3";

  const minSecEl = el("minSec");
  const maxSecEl = el("maxSec");
  const fileEl   = el("soundFile");
  const urlEl    = el("soundUrl");

  const startBtn = el("startBtn");
  const pauseBtn = el("pauseBtn");
  const stopBtn  = el("stopBtn");
  const testBtn  = el("testBtn");
  const resetBtn = el("resetBtn");

  const statusEl = el("status");
  const badgeEl  = el("badge");
  const elapsedEl= el("elapsed");
  const countEl  = el("count");
  const logEl    = el("log");
  const ringFg   = el("ringFg");
  const ringText = el("ringText");
  const soundNameEl = el("soundName");
  const nextInEl    = el("nextIn");

  const modal      = el("modal");
  const modalClose = el("modalClose");
  const modalCur   = el("modalCur");
  const urlOpt     = el("urlOpt");
  const urlBox     = el("urlBox");
  const urlApply   = el("urlApply");
  const defaultOpt = el("defaultOpt");

  let audio = null;
  let fileObjectUrl = null;

  // звук по умолчанию: качаем в память сразу при открытии страницы
  let defaultUrl = DEFAULT_SOUND;
  let defaultLoaded = false;

  // «живая» дорожка: почти беззвучный луп, чтобы браузер не усыплял вкладку в фоне
  const keepAlive = new Audio();
  keepAlive.loop = true;
  keepAlive.src = makeKeepAliveUrl();

  let wakeLock = null;

  let running = false;
  let paused = false;

  let sessionStart = 0;
  let pausedAt = 0;
  let pausedTotal = 0;

  let tickTimer = null;
  let fireTimer = null;
  let nextFireAt = 0;      // Date.now() момента следующего сигнала
  let intervalMs = 0;      // длина текущего ожидания (для кольца)
  let firing = false;

  let playCount = 0;

  function log(msg) {
    const d = document.createElement("div");
    d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logEl.prepend(d);
  }

  function clampInterval(minS, maxS) {
    minS = Math.max(1, Number(minS) || 1);
    maxS = Math.max(1, Number(maxS) || 1);
    if (maxS < minS) [minS, maxS] = [maxS, minS];
    return [minS, maxS];
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function fmt(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    const h = String(Math.floor(total / 3600)).padStart(2, "0");
    const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
    const s = String(total % 60).padStart(2, "0");
    return `${h}:${m}:${s}`;
  }

  function elapsedMs() {
    if (!running) return 0;
    const end = paused ? pausedAt : Date.now();
    return end - sessionStart - pausedTotal;
  }

  function updateRing() {
    if (running && !paused && nextFireAt && intervalMs > 0) {
      const remaining = Math.max(0, nextFireAt - Date.now());
      const pct = 100 * (1 - remaining / intervalMs);
      ringFg.style.strokeDashoffset = String(100 - pct);
      const secs = Math.ceil(remaining / 1000);
      ringText.textContent = String(secs);
      nextInEl.textContent = `${secs} сек`;
    } else {
      ringFg.style.strokeDashoffset = "100";
      ringText.textContent = paused ? "| |" : "—";
      nextInEl.textContent = paused ? "пауза" : "—";
    }
  }

  function updateUI() {
    elapsedEl.textContent = fmt(elapsedMs());
    countEl.textContent = String(playCount);
    updateRing();
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function setBadge(state) {
    badgeEl.className = "badge " + (state === "on" ? "on" : state === "paused" ? "paused" : "");
    badgeEl.textContent = state === "on" ? "жарим" : state === "paused" ? "пауза" : "стоп";
  }

  function clearTimers() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    if (fireTimer) { clearTimeout(fireTimer); fireTimer = null; }
    nextFireAt = 0;
  }

  // ---------- звук ----------

  function makeKeepAliveUrl() {
    // 2 секунды wav, 8 кгц, моно, 16 бит: тон 40 гц на ~-57 dbfs.
    // для уха это тишина, но для браузера страница «играет звук» и не попадает под троттлинг.
    const rate = 8000, secs = 2, n = rate * secs;
    const buf = new ArrayBuffer(44 + n * 2);
    const v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      v.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * 40 * i / rate) * 0.002 * 32767), true);
    }
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }

  const defaultReady = fetch(DEFAULT_SOUND)
    .then((r) => { if (!r.ok) throw new Error(`http ${r.status}`); return r.blob(); })
    .then((b) => {
      defaultUrl = URL.createObjectURL(b);
      defaultLoaded = true;
      log(`звук по умолчанию загружен (${DEFAULT_SOUND}, ${Math.round(b.size / 1024)} кб)`);
    })
    .catch((e) => {
      // например, открыли через file:// — тогда просто отдадим путь плееру напрямую
      log(`не удалось предзагрузить ${DEFAULT_SOUND} (${e?.message || e}), будет грузиться по факту`);
    });
  defaultReady.then(() => ensureAudioLoaded());

  async function ensureAudioLoaded() {
    const file = fileEl.files && fileEl.files[0];
    const url  = (urlEl.value || "").trim();

    if (fileObjectUrl) {
      URL.revokeObjectURL(fileObjectUrl);
      fileObjectUrl = null;
    }

    let src, state, name;
    if (file) {
      fileObjectUrl = URL.createObjectURL(file);
      src = fileObjectUrl;
      state = "свой файл";
      name = file.name;
    } else if (url) {
      src = url;
      state = "по ссылке";
      name = url;
    } else {
      await defaultReady;
      src = defaultUrl;
      state = defaultLoaded ? "по умолчанию · в памяти" : "по умолчанию";
      name = DEFAULT_SOUND;
    }

    if (!audio || audio.dataset.src !== src) {
      audio = new Audio(src);
      audio.preload = "auto";
      audio.dataset.src = src;
      audio.load();
    }
    soundNameEl.textContent = (file || url) ? `${state} · ${name}` : "сейчас выбран стандартный звук";
    soundNameEl.classList.toggle("path", !!(file || url));
    modalCur.textContent = name;
  }

  // вызывать только из клика: «разбудить» элемент, чтобы потом play() из таймера прошёл на ios/android
  async function unlockAudio() {
    if (!audio) return;
    try {
      audio.muted = true;
      await audio.play();
      audio.pause();
      audio.currentTime = 0;
    } catch (e) {
      log(`не удалось разблокировать звук: ${e?.message || e}`);
    } finally {
      audio.muted = false;
    }
  }

  function beepFallback() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 440;
    g.gain.value = 0.08;
    o.start();
    setTimeout(() => { o.stop(); ctx.close(); }, 120);
  }

  async function playSound() {
    try {
      if (!audio) {
        beepFallback();
        return;
      }
      audio.currentTime = 0;
      await audio.play();
    } catch (e) {
      beepFallback();
      log(`звук через файл/url не сыграл, использую beep (причина: ${e?.message || e})`);
    }
  }

  // ---------- фон: keep-alive, wake lock, media session ----------

  async function startKeepAlive() {
    try { await keepAlive.play(); }
    catch (e) { log(`фоновая дорожка не запустилась: ${e?.message || e}`); }
  }

  function stopKeepAlive() {
    keepAlive.pause();
    keepAlive.currentTime = 0;
  }

  async function acquireWakeLock() {
    if (wakeLock || !running || paused) return;
    if (!("wakeLock" in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (e) {
      log(`не удалось удержать экран: ${e?.message || e}`);
    }
  }

  async function releaseWakeLock() {
    if (!wakeLock) return;
    try { await wakeLock.release(); } catch {}
    wakeLock = null;
  }

  function setMediaSession(state) {
    if (!("mediaSession" in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: "жарка шашлыка", artist: "таймер сигналов" });
      navigator.mediaSession.playbackState = state;
    } catch {}
  }

  if ("mediaSession" in navigator) {
    const handlers = {
      play:  () => start(),
      pause: () => { if (running && !paused) pauseToggle(); },
      stop:  () => stop(),
    };
    for (const [name, fn] of Object.entries(handlers)) {
      try { navigator.mediaSession.setActionHandler(name, fn); } catch {}
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    // вкладка проснулась: догоняем пропущенный сигнал и возвращаем wake lock (он снимается системой при уходе в фон)
    fireIfDue();
    acquireWakeLock();
    if (running && !paused && keepAlive.paused) startKeepAlive();
  });

  // ---------- таймер ----------

  function scheduleNext() {
    if (!running || paused) return;

    const [minS, maxS] = clampInterval(minSecEl.value, maxSecEl.value);
    const nextIn = randInt(minS, maxS);

    intervalMs = nextIn * 1000;
    nextFireAt = Date.now() + intervalMs;
    setStatus(`следующий сигнал через ${nextIn} сек`);
    if (fireTimer) clearTimeout(fireTimer);
    fireTimer = setTimeout(fireIfDue, intervalMs);
    updateRing();
  }

  // сигнал стреляет по часам, а не по таймеру: setTimeout в фоне могут заморозить,
  // поэтому его дублируют тик каждые 200 мс и событие возврата вкладки
  async function fireIfDue() {
    if (!running || paused || firing || !nextFireAt) return;
    const late = Date.now() - nextFireAt;
    if (late < 0) return;

    firing = true;
    if (fireTimer) { clearTimeout(fireTimer); fireTimer = null; }
    nextFireAt = 0;

    playCount += 1;
    updateUI();
    log(`сигнал #${playCount}` + (late > 2000 ? ` (с опозданием ${Math.round(late / 1000)} сек — вкладка спала)` : ""));
    await playSound();

    firing = false;
    scheduleNext();
  }

  function tick() {
    updateUI();
    fireIfDue();
  }

  async function start() {
    if (running && paused) {
      // resume
      paused = false;
      pausedTotal += Date.now() - pausedAt;
      setStatus("жарим…");
      setBadge("on");
      pauseBtn.textContent = "пауза";
      startKeepAlive();
      acquireWakeLock();
      setMediaSession("playing");
      scheduleNext();
      return;
    }

    if (running) return;

    await ensureAudioLoaded();
    await unlockAudio();
    await startKeepAlive();

    running = true;
    paused = false;
    sessionStart = Date.now();
    pausedTotal = 0;

    setStatus("жарим…");
    setBadge("on");
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    stopBtn.disabled = false;

    acquireWakeLock();
    setMediaSession("playing");

    tickTimer = setInterval(tick, 200);
    updateUI();

    scheduleNext();
    log("старт жарки");
  }

  function pauseToggle() {
    if (!running) return;

    if (!paused) {
      paused = true;
      pausedAt = Date.now();
      if (fireTimer) { clearTimeout(fireTimer); fireTimer = null; }
      nextFireAt = 0;
      keepAlive.pause();
      releaseWakeLock();
      setMediaSession("paused");
      setStatus("пауза");
      setBadge("paused");
      pauseBtn.textContent = "дальше";
      updateUI();
      log("пауза");
    } else {
      start();
      log("продолжили");
    }
  }

  function stop() {
    if (!running) return;
    const total = fmt(elapsedMs());
    clearTimers();
    running = false;
    paused = false;

    stopKeepAlive();
    releaseWakeLock();
    setMediaSession("none");

    startBtn.disabled = false;
    pauseBtn.disabled = true;
    stopBtn.disabled = true;
    pauseBtn.textContent = "пауза";

    setStatus("остановлено. нажми старт, чтобы начать заново");
    setBadge("off");
    updateUI();
    log(`стоп. итого: ${total}, сигналов: ${playCount}`);
  }

  async function testSound() {
    await ensureAudioLoaded();
    log("тест звука");
    await playSound();
  }

  function resetCounters() {
    playCount = 0;

    if (running) {
      sessionStart = Date.now();
      pausedTotal = 0;
      if (paused) pausedAt = Date.now();
    }
    updateUI();
    log("сброс счётчиков");
  }

  function stepValue(e) {
    const btn = e.currentTarget;
    const input = el(btn.dataset.target);
    const next = Math.max(1, (Number(input.value) || 1) + Number(btn.dataset.delta));
    input.value = String(next);
  }

  startBtn.addEventListener("click", start);
  pauseBtn.addEventListener("click", pauseToggle);
  stopBtn.addEventListener("click", stop);
  testBtn.addEventListener("click", testSound);
  resetBtn.addEventListener("click", resetCounters);

  // ---------- модалка выбора звука ----------

  function openModal() {
    urlBox.hidden = !(urlEl.value || "").trim();
    modal.hidden = false;
  }
  function closeModal() {
    modal.hidden = true;
  }

  el("soundBtn").addEventListener("click", openModal);
  modalClose.addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

  fileEl.addEventListener("change", async () => {
    if (!fileEl.files || !fileEl.files[0]) return;
    urlEl.value = "";
    await ensureAudioLoaded();
    closeModal();
  });

  urlOpt.addEventListener("click", () => {
    urlBox.hidden = false;
    urlEl.focus();
  });

  async function applyUrl() {
    if (!(urlEl.value || "").trim()) { urlEl.focus(); return; }
    fileEl.value = "";
    await ensureAudioLoaded();
    closeModal();
  }
  urlApply.addEventListener("click", applyUrl);
  urlEl.addEventListener("keydown", (e) => { if (e.key === "Enter") applyUrl(); });

  defaultOpt.addEventListener("click", async () => {
    fileEl.value = "";
    urlEl.value = "";
    await ensureAudioLoaded();
    closeModal();
  });
  document.querySelectorAll(".stepper button").forEach((b) => b.addEventListener("click", stepValue));

  window.addEventListener("beforeunload", () => {
    if (fileObjectUrl) URL.revokeObjectURL(fileObjectUrl);
  });

  updateUI();
})();
</script>
</body>
</html>
